name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Build
        run: nix build -L

      - name: Flake check
        run: nix flake check -L

      - name: Format (nix)
        run: |
          nix fmt flake.nix nix/package.nix nix/home-manager.nix
          git diff --exit-code

      - name: Typecheck
        run: nix develop -c bash -lc 'bun install --frozen-lockfile && bun run types && bun run typecheck'

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format (prettier)
        run: bun run format:check
